name: Backend CI/CD

on:
  push:
    branches:
    - "*"
    paths: ['laravel/**']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./laravel
          file: ./laravel/Dockerfile
          push: true
          pull: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/laravel-app:latest
      
      - name: Deploy to AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull kikee282/laravel-app:latest
            docker-compose -f ~/app/docker-compose.prod.yml down
            docker-compose -f ~/app/docker-compose.prod.yml up -d
            docker exec laravel_app_container php artisan migrate --force
